baseURL: "https://leomao.github.io/"
languageCode: "zh-TW"
title: "0/1 World"
theme: "PaperMod"
author: "Leo Mao"
copyright: "Leo Mao © 2017-2025"

markup:
  goldmark:
    extensions:
      cjk:
        enable: true
        eastAsianLineBreaks: true
        eastAsianLineBreaksStyle: css3draft
        escapedSpace: true
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          inline:
          - - \(
            - \)
        enable: true

menu:
  main:
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20

services:
  disqus:
    shortname: "leomao"

params:
  comments: true
  social: true

enableRobotsTXT: true
